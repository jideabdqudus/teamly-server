openapi: 3.0.3
info:
  title: Teamly API
  description: |
    LLM brand visibility monitoring API. Most routes require **both** `X-API-Key` (backend shared secret)
    and `Authorization: Bearer <access_token>` from Supabase auth. Auth signup/login/refresh do not use `X-API-Key`.

    An **account** (one per user) owns many **brands** (a tracked company). All brand-scoped routes —
    dashboard, prompts, competitors, responses, citations, scans, alerts — additionally require an
    **`X-Brand-Id`** header identifying which brand the request targets; it must belong to the caller's account.
    Account-scoped routes (`/me`, `/brands`) ignore it.
  version: 2.0.0

servers:
  - url: http://localhost:3001
    description: Local
  - url: https://api.example.com
    description: Production (replace with your host)

tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Brands
  - name: Provider Keys
  - name: Dashboard
  - name: Scans
  - name: Prompts
  - name: Suggestions
  - name: Tags
  - name: Competitors
  - name: Responses
  - name: Citations
  - name: Sentiment
  - name: Alerts

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BrandIdHeader:
      name: X-Brand-Id
      in: header
      required: true
      description: The brand this request targets. Must belong to the caller's account.
      schema:
        type: string
        format: uuid

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    MetricDelta:
      type: object
      description: A KPI value with its period-over-period delta and daily series.
      properties:
        value:
          type: number
          description: Latest value in the series (0 if none).
        change:
          type: number
          nullable: true
          description: latest − previous; null with fewer than 2 points.
        change_pct:
          type: integer
          nullable: true
          description: Percentage change vs the previous point; null when there is no baseline.
        trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              value:
                type: number

    DashboardData:
      type: object
      description: Composite overview payload. Each headline KPI carries its own delta + trend.
      properties:
        metrics:
          type: object
          properties:
            visibility_score: { $ref: "#/components/schemas/MetricDelta" }
            mention_rate: { $ref: "#/components/schemas/MetricDelta" }
            brand_sov: { $ref: "#/components/schemas/MetricDelta" }
            avg_position: { $ref: "#/components/schemas/MetricDelta" }
            total_citations: { $ref: "#/components/schemas/MetricDelta" }
            sentiment: { $ref: "#/components/schemas/MetricDelta" }
        model_breakdown:
          type: object
          additionalProperties:
            type: number
          description: Latest per-model visibility scores.
        top_prompts:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              text: { type: string }
              score: { type: number }
        recent_citations:
          type: array
          items:
            type: object
        alerts:
          type: array
          items:
            type: object

    Competitor:
      type: object
      description: A tracked competitor enriched with SOV, position, and day-over-day change.
      properties:
        id: { type: string, format: uuid }
        brand_id: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        mentions: { type: integer }
        shareOfVoice: { type: integer, description: 0–100 }
        sovChange:
          type: integer
          nullable: true
          description: SOV points vs the previous daily snapshot; null until two snapshots exist.
        overtookBrand: { type: boolean }
        avgPosition:
          type: integer
          nullable: true
        positionChange:
          type: number
          nullable: true
          description: Change in avg position vs the previous snapshot (lower is better).

    SentimentData:
      type: object
      description: Brand sentiment — daily aggregate, per-model averages, distribution, and negatives.
      properties:
        score:
          type: number
          description: Latest daily aggregate, 0–100 (50 = neutral).
        change:
          type: number
          nullable: true
        change_pct:
          type: integer
          nullable: true
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              value: { type: number }
        by_model:
          type: object
          additionalProperties: { type: integer }
          description: Average sentiment score per model over the window.
        distribution:
          type: object
          properties:
            positive: { type: integer }
            neutral: { type: integer }
            negative: { type: integer }
        recent_negative:
          type: array
          description: Most-negative responses first (score ≤ 40).
          items:
            type: object
            properties:
              response_id: { type: string, format: uuid }
              model: { type: string }
              score: { type: integer, nullable: true }
              snippet: { type: string }
              prompt_text: { type: string }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        prompt_count: { type: integer }

    PromptSuggestion:
      type: object
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        query_type:
          type: string
          enum: [brand, generic, competitor]
        source:
          type: string
          enum: [llm, template, keyword_api]
        status:
          type: string
          enum: [suggested, added, dismissed]
        created_at: { type: string, format: date-time }

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Liveness and dependency checks
      responses:
        "200":
          description: OK — all dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [ok, degraded]
                      redis:
                        type: string
                      supabase:
                        type: string
                      timestamp:
                        type: string
        "503":
          description: Degraded — one or more checks failed

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Register a user (a profile + empty account are created by a DB trigger; the first brand is created in onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
      responses:
        "201":
          description: Created — returns user, account, empty brands array, and session
        "400":
          description: Validation or auth error
        "409":
          description: A user with this email already exists

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: OK
        "401":
          description: Invalid credentials

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (optional Bearer token)
      security: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always returns success message (no enumeration)

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New session
        "401":
          description: Invalid refresh token

  /api/v1/me:
    get:
      tags: [Me]
      summary: Current user profile, account, and the account's brands
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: "OK — { user, account, brands }"
        "401":
          description: Invalid API key or token
        "403":
          description: No account

  /api/v1/me/account:
    patch:
      tags: [Me]
      summary: Update account settings (name and/or enabled_models)
      description: >
        `enabled_models` is account-level and shared across brands. A model may
        only be enabled if the account has a validated key for its provider
        (else 400 MODEL_WITHOUT_KEY).
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: Updated
        "400":
          description: A model was enabled without a provider key

  /api/v1/provider-keys:
    get:
      tags: [Provider Keys]
      summary: Masked list of the account's configured provider keys
      description: BYOK — keys are stored AES-256-GCM encrypted; only masked forms are ever returned.
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: "OK — [{ provider, masked, last_validated_at }]"

  /api/v1/provider-keys/{provider}:
    put:
      tags: [Provider Keys]
      summary: Validate and store a provider key (upsert)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, google, xai, perplexity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        "200":
          description: "Validated + stored — { provider, masked, valid: true }"
        "400":
          description: Invalid key or unknown provider
    delete:
      tags: [Provider Keys]
      summary: Remove a provider key (disables its models)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, google, xai, perplexity]
      responses:
        "200":
          description: Removed

  /api/v1/brands:
    get:
      tags: [Brands]
      summary: List the account's brands
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [Brands]
      summary: Create a brand under the account
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand_name]
              properties:
                brand_name:
                  type: string
                domain:
                  type: string
                industry:
                  type: string
                enabled_models:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created
        "400":
          description: Validation error

  /api/v1/brands/{id}:
    patch:
      tags: [Brands]
      summary: Update a brand (brand_name / domain / industry / enabled_models)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Brand not found
    delete:
      tags: [Brands]
      summary: Delete a brand (refuses the account's last brand)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
        "400":
          description: Cannot delete the last brand
        "404":
          description: Brand not found

  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard overview — per-KPI deltas & trends, model breakdown, top prompts, citations, alerts
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardData"

  /api/v1/dashboard/visibility:
    get:
      tags: [Dashboard]
      summary: Raw visibility_daily history for the brand
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: A visibility_daily row (score, totals, brand_sov, avg_position, sentiment_score, model_scores).
        "500":
          description: DB error

  /api/v1/scans:
    post:
      tags: [Scans]
      summary: Start a new scan
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                triggered_by:
                  type: string
                  enum: [manual, onboarding]
                  default: manual
                prompt_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  nullable: true
                model_ids:
                  type: array
                  items:
                    type: string
                  nullable: true
      responses:
        "201":
          description: Scan created and queued
        "409":
          description: Scan already running

  /api/v1/scans/{id}:
    get:
      tags: [Scans]
      summary: Scan status and progress
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "404":
          description: Not found

  /api/v1/prompts/suggestions:
    get:
      tags: [Suggestions]
      summary: List prompt suggestions
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: status
          in: query
          schema:
            type: string
            enum: [suggested, added, dismissed]
            default: suggested
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PromptSuggestion" }

  /api/v1/prompts/suggestions/generate:
    post:
      tags: [Suggestions]
      summary: Generate suggestions (LLM via the account's key; template fallback)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
      responses:
        "200":
          description: The current suggested set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PromptSuggestion" }

  /api/v1/prompts/suggestions/{id}/add:
    post:
      tags: [Suggestions]
      summary: Add a suggestion as a tracked prompt (marks it added)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Created
        "404":
          description: Not found

  /api/v1/prompts/suggestions/{id}/dismiss:
    post:
      tags: [Suggestions]
      summary: Dismiss a suggestion (won't resurface on regenerate)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dismissed
        "404":
          description: Not found

  /api/v1/prompts:
    get:
      tags: [Prompts]
      summary: List prompts with visibility metrics
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      responses:
        "200":
          description: OK
    post:
      tags: [Prompts]
      summary: Create prompt (query_type auto-classified unless supplied)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 5
                  maxLength: 500
                country:
                  type: string
                country_code:
                  type: string
                language:
                  type: string
                query_type:
                  type: string
                  enum: [brand, generic, competitor]
                  description: Overrides the auto-classification when supplied.
                tag_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created

  /api/v1/prompts/{id}:
    patch:
      tags: [Prompts]
      summary: Update prompt
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                country:
                  type: string
                country_code:
                  type: string
                language:
                  type: string
                active:
                  type: boolean
                query_type:
                  type: string
                  enum: [brand, generic, competitor]
                tag_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Replaces the prompt's tag set.
      responses:
        "200":
          description: OK
        "404":
          description: Not found
    delete:
      tags: [Prompts]
      summary: Delete prompt
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List brand tags with prompt counts
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tag" }
    post:
      tags: [Tags]
      summary: Create a tag (idempotent per brand)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "201":
          description: Created

  /api/v1/tags/{id}:
    delete:
      tags: [Tags]
      summary: Delete a tag (unlinks it from every prompt)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /api/v1/competitors:
    get:
      tags: [Competitors]
      summary: List competitors with SOV, position, and day-over-day change
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Competitor"
    post:
      tags: [Competitors]
      summary: Add competitor
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                domain:
                  type: string
      responses:
        "201":
          description: Created

  /api/v1/competitors/{id}:
    delete:
      tags: [Competitors]
      summary: Remove competitor
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "404":
          description: Not found

  /api/v1/responses:
    get:
      tags: [Responses]
      summary: Paginated LLM responses
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: promptId
          in: query
          schema:
            type: string
            format: uuid
        - name: model
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK

  /api/v1/responses/{id}:
    get:
      tags: [Responses]
      summary: Response detail with mentions and citations
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "404":
          description: Not found

  /api/v1/citations:
    get:
      tags: [Citations]
      summary: Paginated citations
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: domain
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK

  /api/v1/sentiment:
    get:
      tags: [Sentiment]
      summary: Brand sentiment — aggregate, trend, per-model, distribution, and negatives
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BrandIdHeader"
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SentimentData"

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: Alert history (latest 50)
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: unread
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: OK

  /api/v1/alerts/{id}/read:
    patch:
      tags: [Alerts]
      summary: Mark alert as read
      security:
        - ApiKeyAuth: []
          BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
